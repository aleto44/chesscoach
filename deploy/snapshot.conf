# Chess Coach's part of laptop-server's daily snapshot (/srv/README.md, "Snapshots").
# The database is dumped by the server itself (consistent while it runs), never copied live.
# Left out: puzzles.db (the Lichess set, ~400 MB, downloadable again from the app; the student's
# puzzle attempts are in chesscoach.db), the coach's sign-in (claude/, just sign in again) and src/
# (it's the git repo on the desktop).
PATHS=(docker-compose.yml data/remote.json data/sounds)

pre() {
  docker exec chesscoach chesscoach-server backup /data/snapshot-dump.db --data /data
  install -m 600 /srv/services/chesscoach/data/snapshot-dump.db "$DUMP/chesscoach.db"
  rm -f /srv/services/chesscoach/data/snapshot-dump.db
}
